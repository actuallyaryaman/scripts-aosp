name: Validate toolkit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl -fLsS https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Syntax checks
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m compileall -q scripts tests maintainer
      - name: Standalone checks
        run: |
          python3 tests/toolkit_test.py
      - name: Public files and history secret audit
        run: python3 scripts/maintenance/publication_check.py --gitleaks --history
